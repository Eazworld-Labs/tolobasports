services:
  web:
    build:
      context: .
      args:
        VITE_YOUR_SERVICE_ID: ${VITE_YOUR_SERVICE_ID:-}
        VITE_YOUR_TEMPLATE_ID: ${VITE_YOUR_TEMPLATE_ID:-}
        VITE_YOUR_PUBLIC_KEY: ${VITE_YOUR_PUBLIC_KEY:-}
    image: tolobasports-web
    container_name: tolobasports-web
    ports:
      - "${APP_PORT:-80}:80"
    restart: unless-stopped
